# Target: Silver (custom integrations are graded 📦 Custom; ADR-0022 used as the bar)
rules:
  # Bronze
  action-setup: done              # find_nearby registered in async_setup
  appropriate-polling: done       # reads HA states each interval; API only when a location moves past the cached search (5 km - radius, min 300 m) or the cache is older than 24 h
  brands: done
  common-modules: done            # coordinator.py, entity.py
  config-flow: done               # ADR-0010
  config-flow-test-coverage: done
  dependency-transparency: done   # python-jejakmasjid client library on PyPI
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done     # health check before create_entry
  test-before-setup: done         # first refresh raises ConfigEntryNotReady
  unique-config-entry: done       # single_config_entry
  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done         # ADR-0008 codeowners
  log-when-unavailable: done      # coordinator logs once
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Public API, no credentials.
  test-coverage: done
  # Gold
  devices: done                   # one service device
  diagnostics: done               # locations redacted
  discovery:
    status: exempt
    comment: Cloud service, nothing to discover (ADR-0011 n/a).
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: Service, no devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done           # sensors follow persons gaining/losing GPS
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: Nothing in data; options flow covers radius and interval.
  repair-issues:
    status: exempt
    comment: No user-fixable states.
  stale-devices: done             # stale person sensors removed from the registry
  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
